    el('div',{class:'qs'},[q('Travaux annulés / reportés','annules','obsAnnules',{nonFirst:true, note:'si oui, envoi RG', focus:true}), q('Problèmes rencontrés / aléas','aleas','obsAleas',{nonFirst:true, note:'si oui, envoi RG', focus:true}), q('Impact sur la qualité de service','impact','obsImpact',{nonFirst:true, note:'si oui, envoi RE et RU', focus:true})]),
    cks([flagBox('photos','Photos en annexe')])],
    quick('Rien à signaler', emptyOf(y,{annules:'non',aleas:'non',impact:'non'})));
  // Contrôles techniques réalisés : au moins un contrôle coché, ou « Aucun contrôle réalisé »
  { const boxes=[]; const repaint=()=>{ boxes.forEach(b=>b.paint()); changed(); };
    CTRL.forEach(([k,l])=>boxes.push(check(l,()=>fl[k],v=>{ fl[k]=v; if(v) cr.ctrlAucun=false; },repaint)));
    boxes.push(check('Aucun contrôle réalisé',()=>!!cr.ctrlAucun,v=>{ cr.ctrlAucun=v; if(v) CTRL.forEach(([k])=>{ fl[k]=false; }); },repaint,'ck-none'));
    section('controles',[el('div',{class:'cks', 'data-k':'controles'},boxes)]); }
  // État des lieux
  const et=el('div',{class:'etat'},[el('div',{class:'etat-h'},['','Avant travaux','Après travaux',''].map(x=>el('span',{},x)))]);
  ETAT.forEach(([k,lab])=>{ cr.etat[k]=cr.etat[k]||{}; const e=cr.etat[k]; const cnc=w=>seg([['C','C'],['NC','NC']],()=>e[w]||'',v=>{ e[w]=v; },{cls:'cnc', on:changed});
    et.append(el('div',{class:'etat-r', 'data-k':k},[el('span',{class:'etat-l'},lab), cnc('avant'), cnc('apres'), input(e,'obs',{on:changed, ph:EX[k]})])); });
  section('etat',[et], quick('Tout conforme',[()=>ETAT.some(([k])=>!cr.etat[k].avant||!cr.etat[k].apres), ()=>ETAT.forEach(([k])=>{ const e=cr.etat[k]; e.avant=e.avant||'C'; e.apres=e.apres||'C'; })]));
  // Avis final MOE : un grand sélecteur ; le choix retenu prend sa couleur (vert ou rouge)
  { const opt=(icon,l)=>[el('span',{class:'av-i', html:svg(icon)}), el('span',{},l)];
    section('avis',[el('div',{'data-k':'avis'},[seg([['satisfaisant',opt('ok','Chantier satisfaisant')],['non',opt('warn','Chantier non satisfaisant')]],()=>cr.avis||'',v=>{ cr.avis=v; },{cls:'seg-avis', on:changed})]),
      field('Commentaires', area(f,'commentaires',changed,EX.commentaires), {full:true})]); }
  app.append(stepFoot(['Avant le chantier',()=>goStep(1)], ['Vérifier et envoyer',()=>goStep(3)]));
  paintAll(); paint();
  later(()=>guide([['fold','.sec-h','Rubriques pliables','La fiche suit l’ordre du formulaire. Touchez un titre pour plier ou déplier ; les rubriques déjà complètes sont pliées.'],
    ['tocheck','.foot .btn-primary','Ensuite','Quand vous avez fini, passez à la vérification.',true]])); }

// 3 — vérifier et envoyer : ce qui n'a pas été saisi, l'aperçu, l'envoi
function stepCheck(app, cr, p, goStep){ const t=tally(cr), n=t.left;
  const fill=(id, a)=>{ foldOf(cr)[id]=true; cr.step=2; save(); render(); requestAnimationFrame(()=>jumpTo(a)); };
  const dl=(label, ext, make, cls)=>{ const b=el('button',{class:'btn btn-l'+cls},label);
    b.addEventListener('click',async()=>{ b.disabled=true; try{ download(await make(), fileBase(cr)+'.'+ext); markExported(cr); }catch(e){ toast('Fichier impossible à produire : '+(e.message||e)); b.disabled=false; } }); return b; };
  const done=isDone(cr);
  app.append(el('div',{class:'chk-card'},[
      el('div',{class:'chk-h'+(n?'':' ok')},[el('span',{class:'chk-hi', html:n?String(n):svg('check')}), el('div',{},[
        el('h2',{}, n?`${n} élément${n>1?'s':''} non saisi${n>1?'s':''}`:'Tout est saisi'),
        el('p',{}, n?'Touchez un élément pour le compléter, ou téléchargez la fiche telle quelle.':'Vérifiez l’aperçu, puis téléchargez la fiche.')])]),
      el('div',{class:'chk'}, t.secs.map(({s,miss})=>el('div',{class:'chk-r'+(miss.length?'':' ok')},[el('span',{class:'chk-i', html:miss.length?'':svg('check')}), el('div',{class:'chk-m'},[el('strong',{},s.t),
        miss.length ? el('div',{class:'chk-miss'}, missGroups(s,miss).map(({l,a})=>el('button',{type:'button', class:'miss', html:`<span>${esc(l)}</span>`+svg('next'), onclick:()=>fill(s.id,a)})))
                    : el('span',{class:'chk-sum'}, s.sum(cr))])])))]),
    el('div',{class:'chk-out'},[el('div',{class:'chk-a'},[el('button',{class:'btn btn-l', onclick:()=>preview(cr)},'Aperçu'), dl('Télécharger le PDF','pdf',async()=>buildPdf(cr),''), dl('Télécharger le Word','docx',()=>buildDocx(cr),' btn-primary')]),
      el('p',{class:'chk-note'},'Les fichiers arrivent dans « Téléchargements » : joignez-les ensuite à votre message Outlook ou Teams.'),
      cr.exported ? el('p',{class:'chk-done'+(done?'':' stale'), html:svg(done?'check':'warn')+`<span>${done?`Fiche éditée ${esc(stamp(cr.exported))}.`:'Modifiée depuis le dernier téléchargement : téléchargez-la à nouveau.'}</span>`}) : null]),
    stepFoot(['Fin de chantier',()=>goStep(2)], null));
  later(()=>guide([['recap','.chk-h','Vérifier et envoyer','Ce qui n’a pas été saisi est listé ici : touchez un élément pour le compléter. Ensuite, téléchargez le Word et le PDF pour les envoyer.']])); }

// hauteur réelle du bandeau (une ou deux lignes selon l'écran) : la barre des étapes se colle juste dessous
const mastH = () => document.documentElement.style.setProperty('--mast', $('.masthead').offsetHeight+'px');
window.addEventListener('resize', mastH);
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });
// une autre fenêtre de l'application vient d'enregistrer : on reprend ses données au lieu de les écraser
window.addEventListener('storage', e=>{ if(e.key!==KEY || !e.newValue) return;
  try{ const s=JSON.parse(e.newValue); Object.keys(store).forEach(k=>delete store[k]); Object.assign(store, s); if(!cur() && view==='cr') view='cra'; rerender(); }catch(err){ /* contenu illisible : ignoré */ } });
document.addEventListener('DOMContentLoaded', ()=>{ mastH(); if(ongoing(cur())) view='cr'; else store.open=null; history.replaceState(here(),''); render(); });

/* =====================================================================================
   Partage d'un projet par QR code
   Seule la fiche du projet voyage (jamais les comptes rendus). Le code : « MOEF63:P1Z: » + base 32,
   écrit en caractères alphanumériques : un QR compact, lisible par la tablette comme par tout lecteur.
   À la réception, rien de ce qui est déjà sur la tablette n'est effacé ni remplacé.
   ===================================================================================== */
const QR_HEAD = 'MOEF63:P1';
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes){ let out='', bits=0, val=0;
  for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ bits-=5; out+=B32[(val>>bits)&31]; } val&=(1<<bits)-1; }
  if(bits) out+=B32[(val<<(5-bits))&31]; return out; }
function b32dec(s){ const out=[]; let bits=0, val=0;
  for(const ch of s){ const i=B32.indexOf(ch); if(i<0) throw new Error('Code illisible.'); val=(val<<5)|i; bits+=5; if(bits>=8){ bits-=8; out.push((val>>bits)&255); val&=(1<<bits)-1; } }
  return new Uint8Array(out); }
const squeeze = async (bytes, Stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Stream('deflate-raw'))).arrayBuffer());
async function encodeProject(p){ const raw=new TextEncoder().encode(JSON.stringify({ id:p.id, n:p.nom, f:p.f, fl:p.flag, v:p.voies, pe:p.people, g:p.engins }));
  if(window.CompressionStream){ try{ return QR_HEAD+'Z:'+b32enc(await squeeze(raw, CompressionStream)); }catch(e){ /* repli : code non compressé */ } }
  return QR_HEAD+'R:'+b32enc(raw); }
// le contenu reçu est relu champ par champ : rien d'inattendu n'entre dans la tablette
const txt = v => typeof v==='string' ? v.trim().slice(0,200) : '';
function cleanProject(d){ if(!d || !txt(d.n)) throw new Error('Ce code ne contient pas de projet.');
  const f=d.f||{}, pe=d.pe||{}, list=a=>(Array.isArray(a)?a:[]).map(txt).filter(Boolean);
  const voies=(Array.isArray(d.v)?d.v:[]).filter(v=>v && txt(v.nom)).map(v=>({ nom:txt(v.nom), type:v.type==='secondaire'?'secondaire':'principale' }));
  return { id:txt(d.id)||uid('pj'), nom:txt(d.n),
    f:Object.fromEntries(['unite','entite','reseau','ligne','lieu','commande','entreprise','travType'].map(k=>[k, txt(f[k])])),
    flag:{ itc:!!(d.fl&&d.fl.itc), sitePropre:!!(d.fl&&d.fl.sitePropre) },
    voies: voies.length ? voies : [{nom:'V1', type:'principale'}],
    people:Object.fromEntries(ROLES.map(([k])=>[k, list(pe[k])])),
    engins:list(d.g).filter(e=>e!=='Draisine') }; }
// un code collé peut contenir des retours à la ligne ou des espaces : ils sont ignorés
async function decodeProject(text){ const m=String(text||'').replace(/\s+/g,'').toUpperCase().match(/^MOEF63:P1([ZR]):([A-Z2-7]+)$/);
  if(!m) throw new Error('Ce QR code n’est pas un projet MOE-F-63.');
  if(m[1]==='Z' && !window.DecompressionStream) throw new Error('Ce navigateur est trop ancien pour lire ce code.');
  let d; try{ let bytes=b32dec(m[2]); if(m[1]==='Z') bytes=await squeeze(bytes, DecompressionStream); d=JSON.parse(new TextDecoder().decode(bytes)); }
  catch(e){ throw new Error('Code incomplet ou abîmé : scannez-le ou copiez-le à nouveau.'); }
  return cleanProject(d); }

/* ---------- donner : le QR code du projet ---------- */
// correction L : le code s'affiche sur un écran net, autant le garder le moins dense possible
async function shareProject(p){ const code=await encodeProject(p); const qr=qrcode(0,'L'); qr.addData(code,'Alphanumeric'); qr.make();
  const ov=el('div',{class:'modal'}), close=()=>ov.remove();
  const copy=el('button',{class:'btn', onclick:async()=>{ try{ await navigator.clipboard.writeText(code); toast('Code copié : il peut être envoyé par message.'); }catch(e){ toast('Copie impossible sur cet appareil.'); } }},'Copier le code');
  ov.append(el('div',{class:'dlg qr-dlg', role:'dialog', 'aria-modal':'true'},[el('span',{class:'kicker'},'Partager le projet'), el('h3',{},p.nom),
    el('div',{class:'qr', role:'img', 'aria-label':'QR code du projet', html:qr.createSvgTag({cellSize:4, margin:4, scalable:true})}),
    el('p',{},'Sur l’autre tablette : Mes projets, puis « Scanner un projet ». Seul le projet est transmis, jamais les comptes rendus.'),
    el('div',{class:'dlg-row'},[copy, el('button',{class:'btn btn-primary', onclick:close},'Fermer')])]));
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); }); document.body.append(ov); }

/* ---------- recevoir : la caméra, ou un code collé ---------- */
async function scanProject(){ let stream=null, timer=null, done=false, det=null;
  const video=el('video',{playsinline:true, muted:true, autoplay:true}), msg=el('p',{class:'scan-m'},'Placez le QR code du projet dans le cadre.');
  const ov=el('div',{class:'scan'});
  const stop=()=>{ done=true; clearTimeout(timer); if(stream) stream.getTracks().forEach(t=>t.stop()); ov.remove(); };
  ov.close=stop;   // le bouton « retour » coupe aussi la caméra
  ov.append(video, el('div',{class:'scan-frame'}), el('div',{class:'scan-bar'},[msg, el('div',{class:'scan-a'},[
    el('button',{class:'btn btn-l', onclick:()=>{ stop(); pasteCode(''); }},'Coller un code'), el('button',{class:'btn btn-primary btn-l', onclick:stop},'Annuler')])]));
  document.body.append(ov);
  try{ stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'} }, audio:false }); }
  catch(e){ stop(); pasteCode('La caméra n’est pas accessible ici.'); return; }
  if(done){ stream.getTracks().forEach(t=>t.stop()); return; }
  video.srcObject=stream; await video.play().catch(()=>{});
  // lecteur intégré au navigateur quand il existe, sinon décodage image par image
  if(window.BarcodeDetector){ try{ if((await window.BarcodeDetector.getSupportedFormats()).includes('qr_code')) det=new window.BarcodeDetector({formats:['qr_code']}); }catch(e){ det=null; } }
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  const read=async()=>{ if(det){ try{ const r=await det.detect(video); return r[0] ? r[0].rawValue : null; }catch(e){ det=null; } }
    const w=Math.min(720, video.videoWidth), h=Math.round(video.videoHeight*w/video.videoWidth); if(!w || !h) return null;
    cv.width=w; cv.height=h; cx.drawImage(video,0,0,w,h); const r=jsQR(cx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:'dontInvert'}); return r ? r.data : null; };
  const tick=async()=>{ if(done) return; const text=video.readyState>=2 ? await read() : null;
    if(text){ try{ const inc=await decodeProject(text); stop(); receiveProject(inc); return; }catch(e){ msg.textContent=e.message; } }
    timer=setTimeout(tick, 150); };
  tick(); }
// sans caméra : le texte du QR (lu par l'appareil photo de la tablette, ou reçu par message) se colle ici
function pasteCode(reason){ const ov=el('div',{class:'modal'}), ta=el('textarea',{rows:3, placeholder:'MOEF63:P1Z:…', 'aria-label':'Code du projet'}), err=el('p',{class:'err'});
  let busy=false;   // un double toucher n'importe pas deux fois
  const ok=async()=>{ if(busy) return; busy=true; try{ const inc=await decodeProject(ta.value); ov.remove(); receiveProject(inc); }catch(e){ err.textContent=e.message; busy=false; } };
  ov.append(el('div',{class:'dlg', role:'dialog', 'aria-modal':'true'},[el('h3',{},'Importer un projet'),
    el('p',{},(reason?reason+' ':'')+'Scannez le QR code avec l’appareil photo de la tablette, copiez le texte obtenu, puis collez-le ici.'), ta, err,
    el('div',{class:'dlg-row'},[el('button',{class:'btn', onclick:()=>ov.remove()},'Annuler'), el('button',{class:'btn btn-primary', onclick:ok},'Importer')])]));
  document.body.append(ov); setTimeout(()=>ta.focus(),0); }

/* ---------- ce que devient le projet reçu ---------- */
// « compléter » : n'ajoute que ce qui manque (champ vide, voie, personne, engin) ; ne remplace ni n'efface rien
function mergeInto(p, inc){ let n=0;
  Object.entries(inc.f).forEach(([k,v])=>{ if(v && !filled(p.f[k])){ p.f[k]=v; n++; } });
  inc.voies.forEach(v=>{ if(!p.voies.some(x=>x.nom===v.nom)){ p.voies.push(v); n++; } });
  ROLES.forEach(([k])=>inc.people[k].forEach(nm=>{ if(!p.people[k].includes(nm)){ p.people[k].push(nm); n++; } }));
  inc.engins.forEach(e=>{ if(!p.engins.includes(e)){ p.engins.push(e); n++; } });
  p.updated=Date.now(); return n; }
function receiveProject(inc){ const same=store.projects.find(p=>p.id===inc.id) || store.projects.find(p=>p.nom.toLowerCase()===inc.nom.toLowerCase());
  const n=Object.values(inc.people).reduce((a,l)=>a+l.length,0);
  const meta=[inc.f.reseau&&inc.f.ligne?LINES_LABEL(inc.f.reseau,inc.f.ligne):'', inc.f.lieu, inc.voies.map(v=>v.nom).join(', '), inc.f.entreprise, n?`${n} personne${n>1?'s':''}`:''].filter(Boolean).join(' · ');
  const ov=el('div',{class:'modal'}), close=()=>ov.remove();
  const add=(p, msg)=>{ store.projects.push(Object.assign(p,{ explicit:true, created:Date.now(), updated:Date.now(), last:null })); close(); go('cra'); toast(msg); };
  ov.append(el('div',{class:'dlg rcv', role:'dialog', 'aria-modal':'true'},[el('span',{class:'kicker'},'Projet reçu'), el('h3',{},inc.nom), el('p',{class:'rcv-m'},meta),
    el('p',{}, same ? `Vous avez déjà « ${same.nom} » sur cette tablette. Rien de ce qui s’y trouve ne sera effacé ni remplacé.` : 'Il sera ajouté à vos projets.'),
    el('div',{class:'dlg-row rcv-a'}, same ? [el('button',{class:'btn', onclick:close},'Annuler'),
        el('button',{class:'btn', onclick:()=>add(Object.assign(inc,{ id:uid('pj'), nom:inc.nom+' (reçu)' }), 'Projet ajouté à côté du vôtre.')},'Ajouter à côté'),
        el('button',{class:'btn btn-primary', onclick:()=>{ const k=mergeInto(same, inc); close(); go('cra'); toast(k ? `Projet complété : ${k} information${k>1?'s':''} ajoutée${k>1?'s':''}.` : 'Rien de nouveau : votre projet contenait déjà tout.'); }},'Compléter le mien')]
      : [el('button',{class:'btn', onclick:close},'Annuler'), el('button',{class:'btn btn-primary', onclick:()=>add(inc, `Projet « ${inc.nom} » ajouté.`)},'Ajouter le projet')])]));
  document.body.append(ov); }
