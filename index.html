<style>

/* affichage sombre : fond bleu nuit doux, textes clairs sans éblouir (chantiers de nuit) */
:root[data-theme=dark]{ color-scheme:dark;
  --paper:#0E1420; --card:#161F30; --card2:#121A29; --band:#1B2539; --ink:#E3E8F1; --soft:#A3AEC3; --faint:#717D94; --line:#253049; --line-s:#36445F;
  --title:#B8CBF4; --link:#93B2F2; --primary:#2E5BBE; --primary-h:#3A69CF; --rule:#5D7DC6; --hover:#1F2A40; --sel-row:#22304B; --track:#232E46;

*{box-sizing:border-box} html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}

.btn:active,.ck:active,.miss:active,.create:active,.sec-h:active,.stp:active,.crrow:active,.link:active,.back:active{filter:brightness(.94)}
.i{width:20px;height:20px;flex:none}
/* en-tête validé */
.masthead{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:9px 22px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:linear-gradient(135deg,var(--navy) 0%,var(--navy-l) 100%);border-bottom:3px solid var(--teal);color:#fff}
.masthead img{height:32px;background:#fff;border-radius:7px;padding:4px 8px}
.masthead .mt{display:flex;flex-direction:column;line-height:1.2} .masthead .mt strong{font-size:15.5px;font-weight:650} .masthead .mt span{font-size:12px;color:#B9C8EC}
main#app{max-width:1100px;margin:0 auto;padding:22px 24px 64px}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line-s);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--link)} .btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff} .btn-primary:hover{background:var(--primary-h)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff} .btn-s{height:38px;padding:0 14px;font-size:14px}
.btn-l{height:54px;padding:0 22px;border-radius:12px;font-size:16px}
.link{border:0;background:none;padding:0 4px;min-height:40px;font-weight:600;font-size:15px;color:var(--link)} .link:hover{text-decoration:underline}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--soft)} .icon:hover{background:var(--hover);color:var(--ink)}
.icon-ph{width:44px} .back{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin:0 0 6px -4px;padding:0 6px;border:0;background:none;color:var(--link);font-weight:600;font-size:15px} .back .i{width:19px;height:19px}
/* en-tête de page */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 18px} .head-t{min-width:0}
.kicker{display:block;margin-bottom:4px;font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--teal-d)}
.head-t h1{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0;font-size:27px;line-height:1.2;color:var(--title);letter-spacing:-.2px} .head-t p{margin:4px 0 0;color:var(--soft);font-size:15px}
.head-a{display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.3px}
.tag-line{background:#E30613;color:#fff} .tag-soft{background:var(--teal-bg);color:var(--teal-d)}
.muted{color:var(--soft);font-size:14.5px}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px;text-align:center;color:var(--soft);background:var(--card);border:1px dashed var(--line-s);border-radius:var(--r)} .empty p{margin:0}
.ver{margin:0;text-align:center;font-size:12.5px;color:var(--faint)}
/* accueil */
.home{display:flex;flex-direction:column;align-items:center;padding-top:22px}
.home h1{margin:0 0 4px;font-size:28px;color:var(--title);letter-spacing:-.3px}
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:28px;position:relative;z-index:1}
.doc{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 22px 22px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--sh);text-align:center;transition:transform .15s,box-shadow .15s,border-color .15s}
button.doc:hover{transform:translateY(-2px);border-color:var(--line-s);box-shadow:0 2px 4px rgba(20,28,51,.05),0 14px 34px rgba(20,28,51,.10)}
.doc-art{width:150px} .form-svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 10px rgba(0,34,114,.12))}
.doc-txt{display:flex;flex-direction:column;gap:3px} .doc-txt strong{font-size:17px;color:var(--title)} .doc-code{font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--teal-d)} .doc-meta{font-size:13.5px;color:var(--soft)}
.doc.off{cursor:default;box-shadow:none;background:var(--card2)} .doc.off .doc-art{filter:grayscale(1);opacity:.45} .doc.off .doc-txt strong{color:var(--soft)} .doc.off .doc-code{color:var(--faint)}
.doc.off .doc-meta{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:20px;background:var(--track);font-weight:600}
.home-track{width:100%;max-width:900px;margin-top:-58px;opacity:.9} .track{display:block;width:100%;height:60px}
/* accueil : l'emblème, la consigne, le compte rendu en cours, l'affichage */
.brand .emblem{display:block;width:76px;height:76px;margin:0 auto 14px;border-radius:18px;box-shadow:0 6px 18px rgba(0,34,114,.22)}
.home-sub{margin:0 0 22px;font-size:16px;color:var(--soft)}
.resume{display:flex;align-items:center;gap:14px;width:100%;max-width:628px;margin:0 0 24px;padding:14px 18px;border:2px solid var(--teal);border-radius:var(--r);background:var(--card);box-shadow:var(--sh);text-align:left}
.resume-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0} .resume-t strong{font-size:17px;color:var(--title)} .resume-t span{font-size:14.5px;color:var(--soft)}
.resume-go{display:flex;color:var(--teal-d)} .resume-go .i{width:24px;height:24px}
.home-foot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:22px}
.theme{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft)} .seg-s button{min-height:36px;min-width:66px;padding:0 12px;font-size:14px}
.tk-s{fill:var(--sleeper)} .tk-r{fill:var(--rail)}
/* mes projets */
.starts{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;margin:0 0 18px}
.create{display:flex;align-items:center;gap:16px;width:100%;min-height:86px;margin:0;padding:14px 20px;border:2px dashed var(--line-s);border-radius:var(--r);background:var(--card2);text-align:left}
.create:hover{border-color:var(--link);background:var(--hover)}
.create-i{flex:none;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff} .create-i .i{width:24px;height:24px;stroke-width:2.4}
.create-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0} .create-t strong{font-size:18px;color:var(--title)} .create-t span{font-size:15px;color:var(--soft)}
.create-go{display:flex;color:var(--title)} .create-go .i{width:24px;height:24px}
.create-qr .create-i{background:var(--teal-bg);color:var(--teal-d)}
.pcards{display:flex;flex-direction:column;gap:14px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:18px 20px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:-4px -8px 0 0}
.pc-t{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-top:4px} .pc-t h2{margin:0;font-size:20px;color:var(--title)}
.pc-m{margin:0;font-size:15px;color:var(--soft)}
.pc-st{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--soft)}
.pc-st.run{font-weight:600;color:var(--ink)} .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-bg)}
.pc-a{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
/* historique */
.h-sub{margin:4px 0 10px;font-size:17px;color:var(--title)}
.crlist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.crrow{display:flex;align-items:center;gap:16px;min-height:74px;padding:10px 10px 10px 20px;border-top:1px solid var(--line);cursor:pointer} .crrow:first-child{border-top:0} .crrow:hover{background:var(--hover)}
.crrow-m{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0} .crrow-m strong{font-size:17px} .crrow-m .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:14.5px;font-weight:600;color:var(--soft);text-align:right} .state.ok{color:var(--ok)} .state.ready{color:var(--teal-d)} .state.run{color:var(--warn)}
.menu{position:absolute;z-index:95;min-width:230px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-pop)}
.menu-it{display:flex;align-items:center;width:100%;height:48px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:15.5px;text-align:left} .menu-it:hover{background:var(--hover)} .menu-it.danger{color:var(--bad)}
/* nouveau projet : étapes */
.wz{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.wz-rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.wz-step{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:6px 10px;border:0;border-radius:10px;background:none;text-align:left}
.wz-step:hover{background:var(--hover)} .wz-step.on{background:var(--sel-row)}
.wz-n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-s);font-size:14px;font-weight:700;color:var(--soft);background:var(--card)}
.wz-n .i{width:15px;height:15px;stroke-width:2.6} .wz-step.on .wz-n{border-color:var(--primary);background:var(--primary);color:#fff} .wz-step.ok .wz-n{border-color:var(--teal);background:var(--teal);color:#fff}
.wz-tx{display:flex;flex-direction:column;min-width:0} .wz-tx strong{font-size:15.5px} .wz-tx span{font-size:13px;color:var(--soft)}
.wz-pane{display:flex;flex-direction:column;gap:18px;padding:22px 24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.wz-h{display:flex;flex-direction:column;gap:2px} .wz-k{font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--teal-d)} .wz-h h2{margin:0;font-size:21px;color:var(--title)}
.wz-foot{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.rows{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto 44px;gap:12px;align-items:center} .vrow-n{font-size:14px;font-weight:600;color:var(--soft)}
.add-row{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:46px;padding:0 16px;border:1px dashed var(--line-s);border-radius:10px;background:none;color:var(--link);font-weight:600}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 4px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card2);font-weight:600}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;max-width:560px}
.recap{border:1px solid var(--line);border-radius:12px;padding:12px 16px} .recap-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px} .recap-h strong{color:var(--title)}
.recap dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:4px 14px;margin:0} .recap dt{color:var(--soft);font-size:14.5px} .recap dd{margin:0;font-weight:600;font-size:15px}
/* champs */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 18px} .wide{grid-column:span 2} .full{grid-column:1 / -1}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.lab{font-size:14px;font-weight:600;color:var(--label)} .lab-row{display:flex;align-items:center;justify-content:space-between} .req{color:var(--bad)}
.err{font-size:13.5px;font-weight:600;color:var(--bad)} p.err{margin:0}
input[type=text],input[type=date],select,textarea{width:100%;height:48px;border:1px solid var(--line-s);border-radius:10px;padding:0 13px;background:var(--field);font-size:16px}
textarea{height:auto;min-height:48px;padding:11px 13px;line-height:1.45;resize:none;overflow:hidden}
::placeholder{color:var(--ph);font-style:italic;opacity:1}   /* observation fictive : se lit comme un exemple */
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 3px rgba(0,58,143,.12)}
.combo{position:relative;display:flex;align-items:center;gap:8px} .combo select{appearance:none;-webkit-appearance:none;padding-right:36px}
.combo-chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);display:flex;color:var(--faint);pointer-events:none} .combo-chev .i{width:18px;height:18px}
.combo-back{flex:none;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--hover);font-size:14px;font-weight:600;color:var(--soft)}
.time{display:flex;align-items:center;gap:8px} .time .combo{width:92px} .time-h{font-weight:600;color:var(--soft)}
/* choix exclusif : Oui | Non — le choix retenu ressort en blanc */
.seg{display:inline-flex;align-items:center;padding:3px;background:var(--track);border-radius:12px;align-self:flex-start}
.seg button{min-height:42px;min-width:74px;padding:0 16px;border:0;border-radius:9px;background:none;font-size:15.5px;font-weight:600;color:var(--seg-off);transition:background .12s,color .12s}
.seg button.on{background:var(--seg-on);color:var(--title);box-shadow:0 0 0 1px rgba(0,34,114,.16),0 2px 6px rgba(0,20,60,.12)}
.seg-sep{flex:none;width:1px;height:22px;background:var(--line-s);transition:opacity .12s}
.seg button.on + .seg-sep,.seg .seg-sep:has(+ button.on){opacity:0}
.seg.cnc button.on[data-v=NC]{color:var(--bad)}   /* une non-conformité se voit */
/* puce à cocher : une coche apparaît et la puce se teinte */
.cks{display:flex;flex-wrap:wrap;gap:10px}
.ck{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:0 18px;border:1px solid var(--line-s);border-radius:24px;background:var(--card);font-size:15.5px;font-weight:500;text-align:left;transition:background .15s,border-color .15s,color .15s}
.ck-ic{display:none;color:var(--teal-d)} .ck-ic .i{width:18px;height:18px;stroke-width:2.8}
.ck.on{padding-left:13px;border-color:var(--chip-bd);background:var(--chip-bg);color:var(--chip-fg);font-weight:600} .ck.on .ck-ic{display:flex}
.ck-none{border-style:dashed}
.multi{display:flex;flex-direction:column;gap:10px}
/* avis final : un grand sélecteur, le choix retenu prend sa couleur */
.seg-avis{display:flex;width:100%;padding:4px}
.seg-avis button{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;font-size:16.5px}
.av-i{display:flex} .av-i .i{width:22px;height:22px}
.seg-avis button.on[data-v=satisfaisant]{color:var(--ok)} .seg-avis button.on[data-v=non]{color:var(--bad)}
/* compte rendu : les trois étapes, comme les stations d'une ligne */
.head-cr{margin-bottom:12px}
.steps{position:sticky;top:var(--mast,54px);z-index:20;display:flex;align-items:center;gap:6px;margin:0 -24px 20px;padding:8px 24px;background:var(--veil);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.stp{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px 0 6px;border:0;border-radius:12px;background:none;font-size:16px;font-weight:600;color:var(--soft);white-space:nowrap}
.stp:hover{background:var(--hover)}
.stp-n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--line-s);background:var(--card);font-size:14.5px;font-weight:700;color:var(--soft)}
.stp-n .i{width:16px;height:16px;stroke-width:3}
.stp.ok .stp-n{border-color:var(--teal);background:var(--teal);color:#fff}
.stp.on{color:var(--title)} .stp.on .stp-n{border-color:var(--primary);background:var(--primary);color:#fff}
.stp-l{flex:1;min-width:16px;height:4px;border-radius:2px;background:var(--line-s)} .stp-l.ok{background:var(--teal)}
.foot{display:flex;align-items:center;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-s)}
.foot-n{flex:1;margin:0;font-size:14.5px;color:var(--soft)} .foot-sp{flex:1}
/* 1 — avant le chantier */
.start{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.st{display:flex;flex-direction:column;gap:12px;padding:18px 22px 20px;border-top:1px solid var(--line)} .st:first-child{border-top:0}
.st-h{display:flex;align-items:center;gap:12px} .st-h h2{flex:1;margin:0;font-size:18px;color:var(--title)}
.st-n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--title);background:var(--card);font-size:14.5px;font-weight:700;color:var(--title)}
.st-n.ok{border-color:var(--teal);background:var(--teal);color:#fff} .st-n .i{width:16px;height:16px;stroke-width:2.8}
.st-b{padding-left:44px} .st-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:14px 28px} .st-row .fld{min-width:240px}
/* 2 — fin de chantier : rubriques pliables, au bandeau de la fiche */
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:-4px 0 12px} .sheet-bar p{margin:0;font-size:15px;color:var(--soft)}
.sheet{display:flex;flex-direction:column;gap:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 18px 10px 14px;border:0;border-bottom:2px solid transparent;background:var(--band);text-align:left}
.sec.open .sec-h{border-bottom-color:var(--rule)}
.sec-chev{flex:none;display:flex;color:var(--title);transform:rotate(-90deg);transition:transform .15s} .sec.open .sec-chev{transform:none} .sec-chev .i{width:22px;height:22px;stroke-width:2.4}
.sec-tt{flex:1;display:flex;flex-direction:column;min-width:0} .sec-tt h2{margin:0;font-size:18px;color:var(--title)}
.sec-sub{font-size:14.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sec-sub:empty{display:none}
.badge{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;background:var(--track);font-size:14px;font-weight:600;color:var(--soft);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge .i{width:16px;height:16px;stroke-width:2.8}
.sec-b{display:none;flex-direction:column;gap:18px;padding:18px 20px 22px} .sec.open .sec-b{display:flex}
.sec-tools{display:flex;justify-content:flex-end;margin:-8px 0 -10px}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:15px}
.qs{display:flex;flex-direction:column}
.qn{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1.5fr);gap:16px;align-items:center;min-height:62px;padding:7px 0;border-top:1px solid var(--line)} .qn:first-child{border-top:0}
.q-l{display:flex;flex-direction:column;font-weight:600;font-size:16px}
.renvoi{font-size:13px;font-weight:500;font-style:italic;color:var(--soft)} .renvoi.on{color:var(--warn);font-weight:700;font-style:normal}
.climat{display:grid;grid-template-columns:210px auto minmax(0,1fr);gap:14px 20px;align-items:end}
.etat{display:flex;flex-direction:column}
.etat-h,.etat-r{display:grid;grid-template-columns:minmax(0,1.1fr) 164px 164px minmax(0,1.4fr);gap:14px;align-items:center}
.etat-h{padding-bottom:6px;font-size:13.5px;font-weight:600;color:var(--soft)} .etat-h span{text-align:center}
.etat-r{min-height:62px;border-top:1px solid var(--line)} .etat-l{font-weight:600}
.etat-r .seg{display:flex;width:100%} .etat-r .seg button{flex:1;min-width:0}
.etat-r.one{grid-template-columns:minmax(0,1.1fr) 164px minmax(0,1.6fr)}
.flash{border-radius:8px;animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{background:var(--teal-bg);box-shadow:0 0 0 6px var(--teal-bg)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
/* 3 — vérifier et envoyer */
.chk-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.chk-h{display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--warn-bg);border-bottom:1px solid var(--line)} .chk-h.ok{background:var(--ok-bg)}
.chk-hi{flex:none;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:2px solid var(--warn-l);background:var(--card);font-size:19px;font-weight:700;color:var(--warn)}
.chk-h.ok .chk-hi{border-color:var(--ok);color:var(--ok)} .chk-hi .i{width:22px;height:22px;stroke-width:2.8}
.chk-h h2{margin:0;font-size:20px} .chk-h p{margin:2px 0 0;font-size:15px;color:var(--soft)}
.chk{display:flex;flex-direction:column}
.chk-r{display:flex;align-items:flex-start;gap:14px;padding:14px 22px;border-top:1px solid var(--line)} .chk-r:first-child{border-top:0}
.chk-i{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--warn-l);background:var(--card)}
.chk-r.ok .chk-i{border-color:var(--teal);background:var(--teal);color:#fff} .chk-i .i{width:15px;height:15px;stroke-width:2.8}
.chk-m{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0} .chk-m strong{font-size:16.5px} .chk-r.ok .chk-m strong{color:var(--soft)}
.chk-sum{margin-top:-6px;font-size:15px;color:var(--soft)} .chk-sum:empty{display:none}
.chk-miss{display:flex;flex-wrap:wrap;gap:8px}
.miss{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 14px;border:1px solid var(--warn-l);border-radius:10px;background:var(--miss-bg);font-size:15px;font-weight:600;color:var(--miss-fg)}
.miss:hover{background:var(--miss-h)} .miss .i{width:18px;height:18px}
.chk-out{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-top:18px}
.chk-a{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px}
.chk-note{margin:0;font-size:14px;color:var(--soft);text-align:right} .chk-done.stale{color:var(--warn)}
.chk-done{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;font-weight:600;color:var(--ok)}
/* guide de première utilisation */
.coach{position:fixed;inset:0;z-index:100;touch-action:none}
.coach-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,18,56,.58);transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none}
.coach-hole::after{content:"";position:absolute;inset:-4px;border:3px solid var(--teal);border-radius:17px;animation:coachPulse 1.6s ease-out infinite}
@keyframes coachPulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.coach-tip{position:fixed;padding:16px 18px 10px;background:var(--card);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.32)}
.coach-tip::before{content:"";position:absolute;left:calc(var(--ax,50%) - 8px);width:16px;height:16px;background:var(--card);transform:rotate(45deg)}
.coach-tip[data-side=below]::before{top:-7px} .coach-tip[data-side=above]::before{bottom:-7px}
.coach-tip[data-side=right]::before{left:-7px;top:calc(var(--ay,50%) - 8px)} .coach-tip[data-side=left]::before{left:auto;right:-7px;top:calc(var(--ay,50%) - 8px)} .coach-tip[data-side=over]::before{display:none}
.coach-k{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--teal-d)}
.coach-tip h3{margin:3px 0 4px;font-size:19px;color:var(--title)} .coach-tip p{margin:0 0 8px;font-size:15.5px;line-height:1.5}
.coach-a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:6px}
.wl{max-width:520px;padding:26px 28px 20px} .dlg.wl h3{margin:2px 0 6px;font-size:26px} .dlg.wl p{margin:0 0 14px}
.wl-r{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-top:1px solid var(--line)} .wl-r strong{display:block;font-size:16.5px} .wl-r span{font-size:15px;color:var(--soft)}
.wl-r .stp-n{border-color:var(--primary);color:var(--title)}
.wl-a{align-items:center;justify-content:space-between;margin-top:10px}
.ver .link{min-height:32px;font-size:12.5px}
/* partage par QR code */
.qr-dlg{max-width:440px;text-align:center} .qr-dlg .dlg-row{justify-content:center}
.qr{width:min(360px,76vw);margin:12px auto 14px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#FFFFFF} .qr svg{display:block;width:100%;height:auto}
.dlg.rcv{max-width:560px} .dlg p.rcv-m{margin:-4px 0 12px;font-weight:600;color:var(--ink)} .rcv-a{flex-wrap:wrap}
.scan{position:fixed;inset:0;z-index:90;background:#000}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:44%;width:min(64vw,56vh,420px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--teal);border-radius:22px;box-shadow:0 0 0 200vmax rgba(0,0,0,.45)}
.scan-bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,18,56,.86);color:#fff}
.scan-m{margin:0;font-size:16.5px;font-weight:600;text-align:center} .scan-a{display:flex;gap:12px} .scan-a .btn:not(.btn-primary){color:var(--ink)}
/* fenêtres */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,20,60,.42);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--card);border-radius:14px;max-width:460px;width:100%;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)} .dlg h3{margin:0 0 8px;color:var(--title);font-size:19px} .dlg p{margin:0 0 16px;color:var(--soft)} .dlg-row{display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);opacity:0;transition:.2s;z-index:90;background:var(--toast-bg);color:var(--toast-fg);padding:11px 16px;border-radius:9px;font-size:15px;pointer-events:none;max-width:90vw} #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* aperçu */
.pv{position:fixed;inset:0;z-index:70;background:#5B6079;display:flex;flex-direction:column}
.pv-bar{display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--line)}
.pv-bar strong{color:var(--title);font-size:16px} .pv-bar .sp{flex:1}
.pv-body{flex:1;overflow:auto;padding:16px 12px 40px}
.pv-pages{width:794px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sh-page{line-height:1.4;position:relative;width:794px;min-height:1123px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:56px 72px 70px;font-family:"Parisine Office","Parisine","ParisineTT-Regular",Arial,Helvetica,sans-serif;font-size:12.6px;color:#19213A;display:flex;flex-direction:column;gap:9px}
.sh-logo{width:200px;align-self:center;margin-bottom:6px}
.sh-title{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #000;border-bottom:1px solid #000;padding:7px 4px}
.sh-title span:first-child{color:#0070C0;font-weight:700;font-size:16px;letter-spacing:2.4px} .sh-ot{font-weight:700;font-size:15px}
 .sh-t b,.sh-e b{color:#292E6A;font-weight:600} .sh-page em{color:#8A90A2;font-style:normal;letter-spacing:-1px}
.sh-page hr{border:0;border-top:1px solid #000;margin:6px 0;width:100%}
.sh-page h4{margin:4px 0 0;font-size:13px;text-decoration:underline}
.bx{display:inline-block;width:11px;height:11px;border:1px solid #000;vertical-align:-1px;margin:0 3px 0 2px;position:relative}
.bx.on::after{content:"";position:absolute;left:3px;top:-1px;width:3px;height:8px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(40deg)}
.sh-t,.sh-e{width:100%;border-collapse:collapse} .sh-t th,.sh-t td,.sh-e th,.sh-e td{border:1px solid #000;padding:7px 9px;text-align:left;vertical-align:middle;line-height:1.5}
.sh-t th{width:150px;font-size:12.6px} .sh-t small{font-style:italic;font-size:10.5px}
.sh-e th{background:#F2F2F2;text-align:center} .sh-e td:nth-child(2),.sh-e td:nth-child(3){text-align:center;white-space:nowrap}
.sh-it{margin:4px 0 0;font-style:italic}
.sh-foot{position:absolute;left:72px;right:72px;bottom:34px;display:flex;justify-content:space-between;font-size:9.5px}


/* aperçu V2 */
.sh-page.v2{gap:7px;padding:46px 56px 60px}
.v2 .sh-logo{width:150px;align-self:flex-start;margin:0}
.v2 .sh-title{border-top:1.3px solid #000;border-bottom:1.3px solid #000;padding:9px 4px;margin-top:4px}
.v2 .band{margin:8px 0 2px;padding:3px 4px;background:#EEF1F7;border-bottom:1.3px solid #292E6A;font-size:13px;text-decoration:none}
.v2 .g2{display:grid;grid-template-columns:47.5% 49.5%;column-gap:3%;row-gap:6px} .v2 .g2b{display:grid;grid-template-columns:40% 54%;column-gap:6%}
.v2 .f{display:flex;align-items:flex-end;gap:6px;min-height:20px} .v2 .f .l{white-space:nowrap} .v2 .f .w{flex:1;min-width:0;overflow:hidden;border-bottom:1px dotted #7A8094;min-height:16px;padding:0 2px}
.v2 .f .w b{display:block}
.v2 .f.wide{margin-top:6px}
.v2 .q{display:grid;grid-template-columns:26.5% 18.6% minmax(0,1fr);column-gap:3.5%;align-items:flex-end;min-height:22px}
.v2 .a{display:grid;grid-template-columns:29.4% 1fr;align-items:center;min-height:21px} .v2 .a4{display:grid;grid-template-columns:repeat(4,1fr)} .v2 .a2{display:grid;grid-template-columns:1fr 1fr;margin:4px 0}
.v2 .sh-h2{border-bottom:1.3px solid #000;padding-bottom:4px;font-size:10.5px} .v2 .sh-h2 b:first-child{color:#0070C0}
.v2 .sh-t th{width:26.5%} .v2 .rules .rl{border-bottom:1px dotted #7A8094;min-height:20px;line-height:20px}
.v2 .ob{margin-top:4px} .v2 .leg{margin:3px 0 0;font-style:italic;font-size:10px;color:#6B7184}
.v2 .sh-e th.blank{background:none;border-top:0;border-left:0}
.v2 .sh-page em,.v2 em{color:#9AA0B0;font-style:normal}


.bx.on::after{content:"";left:0;top:0;width:100%;height:100%;border:0;transform:none;background:linear-gradient(45deg,transparent 44%,#000 44%,#000 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#000 44%,#000 56%,transparent 56%)}


@media (max-width:900px){ .wz{grid-template-columns:1fr} .wz-rail{position:static;flex-direction:row;overflow-x:auto} .wz-step{width:auto;flex:none} .wz-tx span{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))} .head{flex-wrap:wrap;align-items:flex-start}
  .qn{grid-template-columns:minmax(0,1fr) auto} .q-o{grid-column:1 / -1} .q-o:empty{display:none}
  .etat-h,.etat-r{grid-template-columns:minmax(0,1fr) 164px 164px} .etat-h span:last-child{display:none} .etat-r{padding:8px 0} .etat-r input{grid-column:1 / -1} .etat-r.one{grid-template-columns:minmax(0,1fr) 164px}
  .climat{grid-template-columns:200px auto} .climat .fld:last-child{grid-column:1 / -1}
  .stp{padding-right:8px;font-size:15px} }
@media (max-width:620px){ main#app{padding:16px 14px 56px} .steps{margin:0 -14px 16px;padding:8px 14px} .stp:not(.on) .stp-t{display:none}
  .docs{grid-template-columns:1fr} .grid{grid-template-columns:1fr} .wide{grid-column:auto} .climat{grid-template-columns:1fr}
  .st-b{padding-left:0} .etat-h{grid-template-columns:1fr 1fr;gap:0 10px} .etat-h span:first-child,.etat-h span:last-child{display:none}
  .etat-r{grid-template-columns:1fr 1fr;gap:8px 10px} .etat-l{grid-column:1 / -1} .etat-r.one{grid-template-columns:minmax(0,1fr) 150px} .etat-r.one .etat-l{grid-column:auto}
  .foot{flex-wrap:wrap} .foot-n{flex-basis:100%} .seg-avis button{font-size:15px;white-space:normal;line-height:1.2} .foot .btn-l,.chk-a .btn-l,.pc-a .btn-l{flex:1} .chk-a{width:100%}
  .crrow{flex-wrap:wrap} .crrow .state{flex-basis:100%;order:3;text-align:left} .sheet-bar{flex-wrap:wrap} .create-go{display:none} .starts{grid-template-columns:1fr} }
</style>

<script>'use strict';
/* =====================================================================================
   Comptes rendus MOE voie — CRA (MOE-F-63) · CRT à venir
   Saisie sur tablette, données sur l'appareil, sorties : Word V2 officiel rempli, PDF.
   ===================================================================================== */
const APP_VERSION = '3.5 · 08/10/2026';
const KEY = 'moe-f63-v1';

/* ---------- la fiche MOE-F-63 V2 : cases du modèle Word, numérotées dans l'ordre du document ---------- */
const YN = { lorry:[1,2], train:[3,4], agentTrain:[5,6], consignation:[11,12], ltv:[15,16], ppsps:[17,18], briefing:[19,20],
  stopgo:[21,22], accident:[23,24], intemperie:[25,26] };                 // [Oui, Non]
const NY = { annules:[28,27], aleas:[30,29], impact:[32,31] };           // [Oui, Non] — la fiche place « Non » en premier
const FLAG = { jour:7, nuit:8, itc:9, sitePropre:10, voiePrincipale:13, voieSecondaire:14, photos:33,
  devers:34, ecartement:35, travelage:36, geometrie:37, fc:38 };
const ETAT = [['chem','Cheminements',39],['niches','Niches',43],['plateforme','Plateforme Voie',47],['graisseux','Contrôle état graisseux',51]];
const ROLES = [['representant','Représentants MOE'],['respLot','Responsables de lot'],['respEntreprise','Responsables entreprise'],['respConsignation','Responsables consignation']];
// valeurs d'une intervention reprises pour la suivante (à vérifier par l'agent) ; voie principale / secondaire suivent les voies
const CARRY = { f:['voie','lieu','respConsignation','respEntreprise','engins'], yn:['lorry','train','agentTrain','ltv'] };

/* ---------- utilitaires ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const filled = x => String(x??'').trim()!=='';
function el(tag, attrs={}, kids=[]){ const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(v===false || v==null) continue; if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k, v===true?'':v); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c!=null && c!==false && e.append(c)); return e; }
const fr = iso => { const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?`${m[3]}/${m[2]}/${m[1]}`:(iso||''); };
const today = () => new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const plusDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const uid = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'), 2600); }
function ask(title, msg, ok='Confirmer', danger=false){ return new Promise(res=>{
  const ov=el('div',{class:'modal'}), box=el('div',{class:'dlg', role:'dialog', 'aria-modal':'true'});
  ov.close=()=>{ ov.remove(); res(false); };   // « retour » vaut « Annuler »
  const no=el('button',{class:'btn', onclick:ov.close},'Annuler'), yes=el('button',{class:'btn '+(danger?'btn-danger':'btn-primary'), onclick:()=>{ ov.remove(); res(true); }},ok);
  box.append(el('h3',{},title), el('p',{},msg), el('div',{class:'dlg-row'},[no,yes])); ov.append(box); document.body.append(ov); yes.focus(); }); }

/* ---------- stockage (sur la tablette) ---------- */
const store = (()=>{ let s; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){ s=null; } s=s||{}; s.list=s.list||[]; s.projects=s.projects||[]; s.memo=s.memo||{}; s.guide=s.guide||{}; return s; })();
// projets des versions précédentes : convertis une fois ; un projet sans nom n'est jamais gardé
store.projects.forEach(p=>{ if(p.explicit) return; const f=p.f||{};
  p.explicit=true; p.f={unite:f.unite||'OIT', entite:f.entite||'EF', reseau:f.reseau||'', ligne:f.ligne||'', lieu:f.lieu||'', commande:f.commande||'', entreprise:f.entreprise||'', travType:f.travType||''};
  p.flag={itc:!!(p.flag&&p.flag.itc), sitePropre:!!(p.flag&&p.flag.sitePropre)};
  const vs=String(f.voie||'').split(/\s*,\s*/).filter(Boolean);   // « V1, V2 » : deux voies
  p.voies=vs.length?vs.map(nom=>({nom, type:(p.flag&&p.flag.voieSecondaire)?'secondaire':'principale'})):[{nom:'V1', type:'principale'}];
  p.people={representant:[f.representant].filter(Boolean), respLot:[f.respLot].filter(Boolean), respEntreprise:[f.respEntreprise].filter(Boolean), respConsignation:[f.respConsignation].filter(Boolean)};
  p.engins=f.engins?String(f.engins).split(/\s*,\s*/).filter(Boolean):[]; p.last=null; });
store.projects=store.projects.filter(p=>filled(p.nom));
store.projects.forEach(p=>{ delete p.f.effectifs; if(p.last && p.last.f) delete p.last.f.effectifs; });   // effectifs saisis à chaque intervention
// « Draisine » ne fait plus partie des engins proposés : retirée des projets et de leur dernière intervention
const sansDraisine = s => String(s||'').split(/\s*,\s*/).filter(e=>e && e!=='Draisine');
store.projects.forEach(p=>{ p.engins=sansDraisine((p.engins||[]).join(', ')); if(p.last && p.last.f && p.last.f.engins) p.last.f.engins=sansDraisine(p.last.f.engins).join(', '); });
delete store.memo.engins; delete store.memo.voie;   // ces champs ne sont plus des listes déroulantes
// étape de chaque compte rendu : 1 avant le chantier · 2 fin de chantier · 3 vérifier et envoyer
store.list.forEach(c=>{ if(!c.step) c.step=c.start?1:2; delete c.start; });
// noms tronqués laissés par une version précédente (une entrée par lettre tapée) : retirés s'ils ne servent dans aucun compte rendu
store.projects.forEach(p=>ROLES.forEach(([k])=>{ const a=(p.people&&p.people[k])||[], used=new Set(store.list.filter(c=>c.projectId===p.id).map(c=>String(c.f[k]||'').trim()));
  if(p.people) p.people[k]=a.filter(n=>used.has(n) || !a.some(m=>m!==n && m.startsWith(n))); }));
let saveT=null, saveWarned=0;
function save(){ clearTimeout(saveT); saveT=null;
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ if(Date.now()-saveWarned>30000){ saveWarned=Date.now(); toast(e && e.name==='QuotaExceededError' ? 'Enregistrement impossible : la mémoire de la tablette est pleine.' : 'Enregistrement impossible : le stockage est bloqué sur cet appareil.'); } } }
function touch(cr){ cr.updated=Date.now(); rememberLast(cr); }
function saveSoon(cr){ if(cr) touch(cr); clearTimeout(saveT); saveT=setTimeout(save, 250); }
// une saisie en attente est écrite dès que l'application passe en arrière-plan ou se ferme
const flush = () => { if(saveT) save(); };
function remember(key, val){ const v=String(val||'').trim(); if(!v || v.length>160) return; const a=store.memo[key]=(store.memo[key]||[]).filter(x=>x!==v); a.unshift(v); a.length=Math.min(a.length,8); }
const cur = () => store.list.find(c=>c.id===store.open);
const projOf = cr => store.projects.find(p=>p.id===cr.projectId) || null;

/* ---------- projets ---------- */
function blankProject(){ return { id:uid('pj'), explicit:true, nom:'', created:Date.now(), updated:Date.now(),
  f:{unite:'OIT', entite:'EF', reseau:'', ligne:'', lieu:'', commande:'', entreprise:'', travType:''}, flag:{itc:false, sitePropre:false},
  voies:[{nom:'V1', type:'principale'}], people:{representant:[], respLot:[], respEntreprise:[], respConsignation:[]}, engins:[], last:null }; }
// la dernière intervention du projet sert de départ à la suivante
function rememberLast(cr){ const p=projOf(cr); if(!p) return;
  p.last={ travType:cr.f.travType, f:{}, yn:{} };
  CARRY.f.forEach(k=>{ if(filled(cr.f[k])) p.last.f[k]=cr.f[k]; }); CARRY.yn.forEach(k=>{ if(cr.yn[k]) p.last.yn[k]=cr.yn[k]; }); }
// un nom tapé (champ quitté) rejoint la liste du projet
function addPerson(p, k, name){ const v=String(name||'').trim(); if(p && p.people[k] && v && !p.people[k].includes(v)) p.people[k].push(v); }
function newCR(p){
  const f=p.f, cr={ id:uid('cr'), doc:'cra', created:Date.now(), updated:Date.now(), projectId:p.id, step:1, yn:{}, flag:{}, etat:{}, avis:'',
    f:{ projet:p.nom, commande:f.commande, unite:f.unite||'OIT', entite:f.entite||'EF', reseau:f.reseau, ligne:f.ligne, lieu:f.lieu, entreprise:f.entreprise, engins:(p.engins||[]).join(', '),
      representant:p.people.representant[0]||'', respLot:p.people.respLot[0]||'', respEntreprise:p.people.respEntreprise[0]||'', respConsignation:p.people.respConsignation[0]||'',
      voie:p.voies.length===1?p.voies[0].nom:'', travType:(p.last&&p.last.travType)||f.travType||'' } };
  cr.flag.itc=!!p.flag.itc; cr.flag.sitePropre=!!p.flag.sitePropre;
  if(p.last){ Object.assign(cr.f, p.last.f); Object.assign(cr.yn, p.last.yn); cr.reprise=true; }
  // voies reprises : seulement celles qui existent encore dans le projet ; principale / secondaire suivent leur type
  const names=String(cr.f.voie||'').split(/\s*,\s*/).filter(n=>p.voies.some(v=>v.nom===n));
  cr.f.voie=(names.length ? names : p.voies.length===1 ? [p.voies[0].nom] : []).join(', ');
  const vs=p.voies.filter(v=>cr.f.voie.split(', ').includes(v.nom)); cr.flag.voiePrincipale=vs.some(v=>v.type==='principale'); cr.flag.voieSecondaire=vs.some(v=>v.type==='secondaire');
  if(!filled(cr.f.lieu)) cr.f.lieu=f.lieu||'';
  // une nuit saisie après minuit (avant 8 h) est celle qui a commencé la veille
  if(cr.f.travType==='nuit'){ const du=new Date().getHours()<8 ? plusDays(today(),-1) : today(); cr.flag.nuit=true; cr.f.nuitDu=du; cr.f.nuitAu=plusDays(du,1); }

function checked(cr){
  const on=new Set();
  for(const [k,[o,n]] of Object.entries(YN)){ if(cr.yn[k]==='oui') on.add(o); if(cr.yn[k]==='non') on.add(n); }
  for(const [k,[o,n]] of Object.entries(NY)){ if(cr.yn[k]==='oui') on.add(o); if(cr.yn[k]==='non') on.add(n); }
  for(const [k,c] of Object.entries(FLAG)) if(cr.flag[k]) on.add(c);
  ETAT.forEach(([k,,c])=>{ const e=cr.etat[k]||{}; if(e.avant==='C') on.add(c); if(e.avant==='NC') on.add(c+1); if(e.apres==='C') on.add(c+2); if(e.apres==='NC') on.add(c+3); });
  if(cr.avis==='satisfaisant') on.add(55); if(cr.avis==='non') on.add(56);
  return on;
}
function fileBase(cr){
  const f=cr.f, d = f.travType==='nuit' ? f.nuitDu : f.dateJour;
  const vs=splitList(f.voie), parts=['MOE-F-63 CR activité', f.projet, vs.length?(vs.length>1?'voies ':'voie ')+vs.join('-'):'', fr(d||'').replace(/\//g,'-'), f.numOT?('OT '+f.numOT):''].filter(Boolean);
  return parts.join(' – ').replace(/[\\/:*?"<>|]+/g,'-').slice(0,140);
}

/* ---------- Word : le formulaire V2 officiel, rempli (champs, listes, dates, heures, cases, zones de lignes) ---------- */
const V2_ZONES = ['travauxPrevus','travauxRealises','obsAnnules','obsAleas','obsImpact','commentaires'];
const LINES_BY_RESEAU = { 'RER':['A','B'], 'Métro':['1','2','3','3bis','4','5','6','7','7bis','8','9','10','11','12','13','14'], 'Tramway':['T1','T2','T3a','T3b','T5','T6','T7','T8'] };
function v2Values(cr){
  const f=cr.f, v={};
  ['numOT','representant','respLot','projet','commande','voie','lieu','entreprise','respEntreprise','effectifs','respConsignation','engins',
   'obsLorry','obsTrain','obsPPSPS','obsBriefing','obsStopGo','obsAccident','obsIntemperie','reseau','ligne', ...V2_ZONES].forEach(k=>{ v[k]=String(f[k]??'').trim(); });
  v.unite = String(f.unite??'').trim() || 'OIT'; v.entite = String(f.entite??'').trim() || 'EF';
  v.temperature = String(f.temperature??'').trim().replace('.',',');
  ['dateJour','nuitDu','nuitAu'].forEach(k=>{ const on = k==='dateJour' ? cr.flag.jour : cr.flag.nuit; v[k]=on?fr(f[k]):''; v['_iso_'+k]=on?(f[k]||''):''; });   // dates du seul type de travaux coché
  ['heureDebut','heureFin','heureConsignation'].forEach(k=>{ const m=(k==='heureConsignation' && cr.yn.consignation!=='oui') ? null : String(f[k]||'').match(/^(\d{1,2}):(\d{2})/);   /* heure de consignation seulement si « Oui » */ v['hh_'+k]=m?m[1].padStart(2,'0'):''; v['mm_'+k]=m?m[2]:''; });
  ETAT.forEach(([k],i)=>{ v['obsEtat'+(i+1)] = String((cr.etat[k]&&cr.etat[k].obs)||'').trim(); });
  return v;
}
async function buildDocx(cr){
  const zip = await JSZip.loadAsync(MODELE_B64, {base64:true});
  const v=v2Values(cr), on=checked(cr);
  // largeur d'un texte en Parisine Office (approximation prudente : 0,5 em par caractère), en DXA pour une taille en demi-points
  const textW = (t, hp) => [...t].reduce((w,ch)=>w + (/[ilI.,:;'’ ]/.test(ch)?0.32:/[mwMW]/.test(ch)?0.88:/[A-Z–]/.test(ch)?0.72:0.58), 0) * hp * 10;   // estimation prudente : tient aussi dans une police plus large que Parisine
  const fitSize = (t, avail) => { const hp=19; const w=textW(t,hp); if(w<=avail) return null; return Math.max(14, Math.floor(hp*avail/w)); };   // 9,5 pt → 7 pt au minimum
  const fill = xml => xml.replace(/<w:sdt>(.*?)<\/w:sdt>/gs, (all, body, at) => {
    const tag=(body.match(/<w:tag w:val="([^"]+)"\/>/)||[])[1]; if(!tag) return all;
    if(/^CB\d\d$/.test(tag)){ const c=on.has(+tag.slice(2));
      return '<w:sdt>'+body.replace(/<w14:checked w14:val="[01]"\/>/, `<w14:checked w14:val="${c?1:0}"/>`).replace(/<w:t>[☐☒]<\/w:t>/, `<w:t>${c?'☒':'☐'}</w:t>`)+'</w:sdt>'; }
    const val=v[tag]; if(val===undefined || val==='') return all;
    const rpr=((body.match(/<w:sdtPr><w:rPr>(.*?)<\/w:rPr>/s)||[])[1]||'');
    if(V2_ZONES.includes(tag)){                                   // zone de lignes : une ligne de texte par filet, plus si nécessaire
      const content=(body.match(/<w:sdtContent>(.*)<\/w:sdtContent>/s)||[])[1]||''; const paras=content.match(/<w:p[ >].*?<\/w:p>/gs)||[];
      const ppr=((paras[0]||'').match(/<w:pPr>.*?<\/w:pPr>/s)||[''])[0]; const rr=(((paras[0]||'').match(/<w:rPr>.*?<\/w:rPr>/s)||['<w:rPr></w:rPr>'])[0]);
      const lines=val.split(/\r?\n/); const n=Math.max(paras.length, lines.length);
      const ps=Array.from({length:n},(_,i)=>`<w:p>${ppr}<w:r>${rr}<w:t xml:space="preserve">${esc(lines[i]||'')}</w:t></w:r></w:p>`).join('');
      return '<w:sdt>'+body.replace(/<w:sdtContent>.*<\/w:sdtContent>/s, `<w:sdtContent>${ps}</w:sdtContent>`)+'</w:sdt>'; }
    let b=body.replace('<w:showingPlcHdr/>','');
    if(/<w:date[ >]/.test(b) && v['_iso_'+tag]) b=b.replace(/<w:date(?: w:fullDate="[^"]*")?>/, `<w:date w:fullDate="${v['_iso_'+tag]}T00:00:00Z">`);
    let r2=rpr;
    if(/<w:text\/>/.test(b)){ const i=xml.lastIndexOf('<w:tcW', at); const tc=i>=0 ? +((xml.slice(i, xml.indexOf('/>', i)).match(/w:w="(\d+)"/)||[])[1]||0) : 0;   /* largeur de la cellule, quel que soit l'ordre des attributs */
      const sz = tc ? fitSize(val, tc - 160) : null; if(sz) r2 = rpr.replace(/<w:sz w:val="\d+"\/>/, `<w:sz w:val="${sz}"/>`).replace(/<w:szCs w:val="\d+"\/>/, `<w:szCs w:val="${sz}"/>`); }
    b=b.replace(/<w:sdtContent>.*<\/w:sdtContent>/s, `<w:sdtContent><w:r><w:rPr>${r2}</w:rPr><w:t xml:space="preserve">${esc(val)}</w:t></w:r></w:sdtContent>`);
    return '<w:sdt>'+b+'</w:sdt>'; });
  for(const p of Object.keys(zip.files).filter(n=>/^word\/(document|header\d+)\.xml$/.test(n))) zip.file(p, fill(await zip.file(p).async('string')));
  // N° d'OT relié : la valeur est aussi écrite dans les données liées, que Word affiche en tête de la page 2
  const cx='customXml/item1.xml'; if(zip.file(cx)) zip.file(cx, (await zip.file(cx).async('string')).replace(/<numOT>.*?<\/numOT>|<numOT\/>/, `<numOT>${esc(v.numOT)}</numOT>`));
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* aperçu : un champ d'une ligne garde une ligne (même règle que le Word et le PDF) */
function fitSheet(root){
  root.querySelectorAll('.v2 .f .w').forEach(w=>{ const b=w.querySelector('b'); if(!b) return;
    b.style.whiteSpace='nowrap'; b.style.fontSize=''; let px=parseFloat(getComputedStyle(b).fontSize); const min=px*7/9.5;
    while(b.scrollWidth>w.clientWidth-2 && px>min){ px-=0.4; b.style.fontSize=px+'px'; }
    if(b.scrollWidth>w.clientWidth-2) b.style.whiteSpace='normal'; });
}
// onExport : appelé quand le Word ou le PDF a été produit (la fiche est alors « éditée »)
function openPreview(cr, onExport){
  const ov=el('div',{class:'pv'}); const bar=el('div',{class:'pv-bar'});
  const close=el('button',{class:'btn'},'Fermer');

  const bw=el('button',{class:'btn btn-primary'},'Word'); bw.addEventListener('click',async()=>{ download(await buildDocx(cr), fileBase(cr)+'.docx'); onExport&&onExport(); });

  const body=el('div',{class:'pv-body'}); const pages=el('div',{class:'pv-pages', html:sheetHTML(cr)}); body.append(pages);
  ov.append(bar, body); document.body.append(ov); fitSheet(pages);

/* ---------- la fiche, rubrique par rubrique : ce qui doit être saisi, et le résumé de ce qui l'est ----------
   chaque élément : a = champ où conduire l'agent, l = son nom en clair, g = série (« Après travaux ») */
const has = k => cr => filled(cr.f[k]), yes = k => cr => !!cr.yn[k];
const need = (a, l, done, o={}) => ({ a, l, done, when:o.when, g:o.g });
const ouiNon = v => v==='oui'?'Oui':v==='non'?'Non':'';
const CTRL = [['devers','Dévers / Gauche'],['ecartement','Écartement'],['travelage','Travelage'],['geometrie','Géométrie'],['fc','FC en annexe']];
const MAP = [
  { id:'ident', t:'Identification', items:[ need('unite','Unité',has('unite')), need('entite','Entité',has('entite')), need('representant','Représentant MOE',has('representant')), need('projet','Projet',has('projet')),
      need('reseau','Réseau',has('reseau')), need('ligne','Ligne',has('ligne')), need('voie','Voie(s)',has('voie')), need('lieu','Lieu',has('lieu')) ],
    sum: cr=>[cr.f.numOT&&`OT ${cr.f.numOT}`, cr.f.voie&&`Voie(s) ${cr.f.voie}`, cr.f.lieu].filter(Boolean).join(' · ') },
  { id:'moyens', t:'Entreprise et moyens', items:[ need('reprise','Moyens repris à vérifier',cr=>!cr.reprise), need('entreprise','Entreprise',has('entreprise')), need('effectifs','Effectifs',has('effectifs')),
      need('lorry','Agent Lorry',yes('lorry')), need('train','Train de travaux',yes('train')), need('agentTrain','Agent Train',yes('agentTrain')) ],
    sum: cr=>[cr.f.entreprise, cr.f.effectifs&&`${cr.f.effectifs} personne${cr.f.effectifs>1?'s':''}`, cr.f.engins].filter(Boolean).join(' · ') },
  { id:'types', t:'Types d’activités', items:[ need('travaux','Jour ou nuit',cr=>cr.flag.jour?filled(cr.f.dateJour):cr.flag.nuit?filled(cr.f.nuitDu)&&filled(cr.f.nuitAu):false),
      need('consignation','Sous consignation courant',yes('consignation')), need('heureConsignation','Heure de consignation',has('heureConsignation'),{when:cr=>cr.yn.consignation==='oui'}), need('ltv','LTV',yes('ltv')) ],
    sum: cr=>[cr.flag.nuit?'Nuit':cr.flag.jour?'Jour':'', cr.yn.consignation&&`Consignation ${ouiNon(cr.yn.consignation).toLowerCase()}${cr.yn.consignation==='oui'&&cr.f.heureConsignation?' à '+hm(cr.f.heureConsignation):''}`, cr.yn.ltv&&`LTV ${ouiNon(cr.yn.ltv).toLowerCase()}`].filter(Boolean).join(' · ') },
  { id:'secu', t:'Sécurité', items:[ need('ppsps','Plan de prévention / PPSPS',yes('ppsps')), need('briefing','Briefing',yes('briefing')), need('stopgo','STOP&GO',yes('stopgo')), need('accident','Accident',yes('accident')) ],
    sum: cr=>[['PPSPS','ppsps'],['Briefing','briefing'],['STOP&GO','stopgo'],['Accident','accident']].filter(([,k])=>cr.yn[k]).map(([l,k])=>`${l} ${ouiNon(cr.yn[k]).toLowerCase()}`).join(' · ') },
  { id:'climat', t:'Conditions climatiques', items:[ need('temperature','Température',has('temperature')), need('intemperie','Intempérie',yes('intemperie')) ],
    sum: cr=>[filled(cr.f.temperature)&&`${cr.f.temperature} °C`, cr.yn.intemperie&&(cr.yn.intemperie==='oui'?'Intempérie':'Pas d’intempérie')].filter(Boolean).join(' · ') },
  { id:'horaires', t:'Horaires et travaux', items:[ need('heureDebut','Début d’intervention',has('heureDebut')), need('heureFin','Fin d’intervention',has('heureFin')), need('travauxRealises','Travaux réalisés',has('travauxRealises')),
      need('annules','Travaux annulés / reportés',yes('annules')), need('aleas','Problèmes rencontrés / aléas',yes('aleas')), need('impact','Impact sur la qualité de service',yes('impact')) ],
    sum: cr=>[cr.f.heureDebut&&cr.f.heureFin?`De ${hm(cr.f.heureDebut)} à ${hm(cr.f.heureFin)}`:cr.f.heureDebut?`Début à ${hm(cr.f.heureDebut)}`:'', cr.f.travauxRealises].filter(Boolean).join(' · ') },
  { id:'controles', t:'Contrôles techniques réalisés', items:[ need('controles','Contrôles réalisés',cr=>CTRL.some(([k])=>cr.flag[k])||!!cr.ctrlAucun) ],
    sum: cr=>cr.ctrlAucun?'Aucun contrôle':CTRL.filter(([k])=>cr.flag[k]).map(([,l])=>l).join(' · ') },
  { id:'etat', t:'État des lieux', items:[ ...[['avant','Avant travaux','avant'],['apres','Après travaux','après']].flatMap(([w,g,lw])=>ETAT.map(([k,l])=>need(k, `${l} (${lw})`, cr=>!!(cr.etat[k]&&cr.etat[k][w]), {g}))) ],
    sum: cr=>[['avant','Avant'],['apres','Après']].map(([w,l])=>{ const v=ETAT.map(([k])=>cr.etat[k]&&cr.etat[k][w]).filter(Boolean); if(!v.length) return ''; const nc=v.filter(x=>x==='NC').length; return `${l} : ${nc?`${nc} NC`:'conforme'}`; }).filter(Boolean).join(' · ') },
  { id:'avis', t:'Avis final MOE', items:[ need('avis','Avis',cr=>!!cr.avis) ],
    sum: cr=>cr.avis==='satisfaisant'?'Chantier satisfaisant':cr.avis==='non'?'Chantier non satisfaisant':'' } ];
function tally(cr){ let left=0;
  const secs=MAP.map(s=>{ const miss=s.items.filter(i=>(!i.when||i.when(cr)) && !i.done(cr)); left+=miss.length; return { s, miss }; });
  return { secs, left }; }
// ce qui manque, en clair ; une série entière (tout « Après travaux ») est nommée d'un mot
function missGroups(s, miss){ const out=[];
  miss.forEach(i=>{ const l = i.g && s.items.filter(x=>x.g===i.g).every(x=>miss.includes(x)) ? i.g : i.l; if(!out.some(o=>o.l===l)) out.push({ l, a:i.a }); }); return out; }
// les questions du début d'intervention
const START = cr => [filled(cr.f.heureDebut), !!cr.yn.ppsps, !!cr.yn.ltv, !!cr.yn.consignation && (cr.yn.consignation!=='oui' || filled(cr.f.heureConsignation)), ...ETAT.map(([k])=>!!(cr.etat[k] && cr.etat[k].avant))];
const STEPS_CR = ['Avant le chantier','Fin de chantier','Vérifier et envoyer'];
// où en est un compte rendu
function crState(cr){ if(isDone(cr)) return { t:`Édité ${stamp(cr.exported)}`, cls:'ok' };
  if(cr.exported) return { t:'Modifié depuis l’édition · à rééditer', cls:'run' };
  if(cr.step===1) return { t:'Avant le chantier', cls:'run' };
  const n=tally(cr).left; return n ? { t:`Fin de chantier · ${n} à saisir`, cls:'run' } : { t:'Complet, à envoyer', cls:'ready' }; }
// une fiche est « éditée » quand le Word ou le PDF a été produit après sa dernière modification
const isDone = cr => !!cr.exported && cr.exported >= cr.updated;
// un compte rendu reste « en cours » jusqu'à la fin de son poste : le lendemain 14 h pour une nuit, le lendemain 6 h pour un jour ;
// le soir suivant, le projet propose donc un nouveau compte rendu, même si celui de la veille n'a pas été édité
function shiftEnd(cr){ const d=cr.flag.nuit?cr.f.nuitAu:cr.flag.jour?cr.f.dateJour:''; if(!d) return cr.created+18*3600e3;
  return new Date(d+'T00:00:00').getTime()+(cr.flag.nuit?14:30)*3600e3; }
const ongoing = cr => !!cr && !isDone(cr) && Date.now()<shiftEnd(cr);
const openCR = cr => { store.open=cr.id; go('cr'); };

/* ---------- guide de première utilisation ----------
   un accueil, puis des bulles posées sur l'élément à toucher ; chacune ne s'affiche qu'une fois.
   Toucher l'élément éclairé fait son action ; « Passer le guide » l'arrête ; « Revoir le guide » (accueil) le relance. */
const seen = k => !!store.guide[k] || !!store.guide.off;
const guideOff = () => { store.guide.off=true; save(); };
// le guide d'un écran ne s'ouvre que si l'on y est encore, une fois l'écran posé
const later = fn => { const n=renders; setTimeout(()=>{ if(n===renders && !document.querySelector('.coach,.modal')) fn(); }, 250); };
// étapes : [clé, sélecteur, titre, texte, agir] — agir : toucher l'élément éclairé déclenche son action
function guide(steps){ const todo=steps.filter(([k,sel])=>!seen(k) && $(sel)); if(!todo.length) return;
  let i=0, target=null; const hole=el('div',{class:'coach-hole'}), tip=el('div',{class:'coach-tip', role:'dialog', 'aria-live':'polite'}), ov=el('div',{class:'coach'},[hole, tip]);
  const place=()=>{ const r=target.getBoundingClientRect(), pad=8, W=window.innerWidth, H=window.innerHeight;
    Object.assign(hole.style,{left:`${r.left-pad}px`, top:`${r.top-pad}px`, width:`${r.width+2*pad}px`, height:`${r.height+2*pad}px`});
    const tw=Math.min(380, W-32); tip.style.width=tw+'px'; const th=tip.offsetHeight, gap=pad+16;
    // en dessous, sinon au-dessus, sinon à côté (élément haut comme le rail de l'assistant), sinon en bas de l'écran
    const cx=Math.max(16, Math.min(r.left+r.width/2-tw/2, W-tw-16)), cy=Math.max(12, Math.min(r.top+r.height/2-th/2, H-th-12));
    const [side,left,top] = r.bottom+gap+th<=H-12 ? ['below', cx, r.bottom+gap] : r.top-gap-th>=12 ? ['above', cx, r.top-gap-th]
      : r.right+gap+tw<=W-12 ? ['right', r.right+gap, cy] : r.left-gap-tw>=12 ? ['left', r.left-gap-tw, cy] : ['over', (W-tw)/2, H-th-12];
    Object.assign(tip.style,{left:left+'px', top:top+'px'}); tip.dataset.side=side;
    tip.style.setProperty('--ax', `${Math.max(24, Math.min(r.left+r.width/2-left, tw-24))}px`); tip.style.setProperty('--ay', `${Math.max(24, Math.min(r.top+r.height/2-top, th-24))}px`); };
  const end=()=>{ ov.remove(); window.removeEventListener('resize', place); }; ov.close=end;
  const mark=()=>{ store.guide[todo[i][0]]=1; save(); };
  const next=()=>{ mark(); i++; if(i<todo.length) show(); else end(); };
  const show=()=>{ const [,sel,title,text]=todo[i]; target=$(sel);
    tip.innerHTML=''; tip.append(el('span',{class:'coach-k'}, todo.length>1?`Guide · ${i+1} / ${todo.length}`:'Guide'), el('h3',{},title), el('p',{},text),
      el('div',{class:'coach-a'},[el('button',{type:'button', class:'link', onclick:()=>{ guideOff(); end(); }},'Passer le guide'), el('button',{type:'button', class:'btn btn-primary', onclick:next}, i<todo.length-1?'Suivant':'Compris')]));
    target.scrollIntoView({block:'center'}); requestAnimationFrame(place); };
  // toucher l'élément éclairé : son action si elle est attendue, sinon la bulle suivante
  ov.addEventListener('click',e=>{ if(e.target.closest('.coach-tip')) return; const r=hole.getBoundingClientRect();
    if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) return;
    if(todo[i][4]){ mark(); end(); target.click(); } else next(); });
  window.addEventListener('resize', place); document.body.append(ov); show(); }
// accueil du guide : les trois temps d'un compte rendu
function welcome(then){ const ov=el('div',{class:'modal'});
  const row=(n,t,d)=>el('div',{class:'wl-r'},[el('span',{class:'stp-n'},String(n)), el('div',{},[el('strong',{},t), el('span',{},d)])]);
  ov.append(el('div',{class:'dlg wl', role:'dialog', 'aria-modal':'true'},[el('span',{class:'kicker'},'Comptes rendus MOE voie'), el('h3',{},'Bienvenue'), el('p',{},'Un compte rendu se remplit en trois temps, sans rien ressaisir :'),
    row(1,'Créer le projet du chantier','Une seule fois : ses informations rempliront chaque compte rendu.'),
    row(2,'Au démarrage du chantier','Quatre questions.'),

/* ---------- nouveau projet : six étapes, validées une à une ---------- */
const STEPS = [
  { t:'Identité', d:'Nom, commande, rattachement', ok:p=>filled(p.nom)&&filled(p.f.unite)&&filled(p.f.entite) },

function viewWizard(app){

  const drawRail=()=>railBtns.forEach((b,i)=>{ const ok=STEPS[i].ok(d) && i<5 && (editing || i<=(viewWizard.max||0)), on=i===step; b.classList.toggle('on',on); b.classList.toggle('ok',ok); b.num.innerHTML=ok&&!on?svg('check'):String(i+1); });
  const err=(cond)=> tried && !cond ? 'Obligatoire' : null;
  const content=[
    // 1 — identité
    ()=>[el('div',{class:'grid'},[field('Nom du projet', input(d,'nom',{ph:'ITC RVB Branches Est', on:drawRail}), {req:true, wide:true, err:err(filled(d.nom))}),
        field('N° commande', input(d.f,'commande',{im:'numeric'})), field('Unité', combo(d.f,'unite',{on:drawRail}), {req:true, err:err(filled(d.f.unite))}), field('Entité', combo(d.f,'entite',{on:drawRail}), {req:true, err:err(filled(d.f.entite))})])],
    // 2 — localisation
    ()=>{ const lg=combo(d.f,'ligne',{fmt:v=>LINES_LABEL(d.f.reseau,v), on:drawRail});
      return [el('div',{class:'grid'},[field('Réseau', seg([['RER','RER'],['Métro','Métro'],['Tramway','Tramway']],()=>d.f.reseau||'',v=>{ d.f.reseau=v; if(d.f.ligne && !(LINES_BY_RESEAU[v]||[]).includes(d.f.ligne)) d.f.ligne=''; },{on:()=>{ lg.redraw(); drawRail(); }}), {req:true, err:err(filled(d.f.reseau))}),
          field('Ligne', lg, {req:true, err:err(filled(d.f.ligne))}), field('Lieu / Localisation', input(d.f,'lieu',{ph:'Sucy-Bonneuil / Boissy-St-Léger', on:drawRail}), {wide:true, req:true, err:err(filled(d.f.lieu))}),
          field('Interventions habituelles', seg([['jour','De jour'],['nuit','De nuit']],()=>d.f.travType||'',v=>{ d.f.travType=v; }))]),

        d.voies.forEach((v,i)=>{ const nm=el('input',{type:'text', autocomplete:'off', 'aria-label':`Nom de la voie ${i+1}`}); nm.value=v.nom; nm.addEventListener('input',()=>{ v.nom=nm.value.trim(); drawRail(); });
          box.append(el('div',{class:'vrow'},[el('span',{class:'vrow-n'},`Voie ${i+1}`), nm, seg([['principale','Principale'],['secondaire','Secondaire']],()=>v.type,t=>{ v.type=t||v.type; }),
            d.voies.length>1?el('button',{class:'icon', 'aria-label':'Retirer la voie', html:svg('x'), onclick:()=>{ d.voies.splice(i,1); draw3(); drawRail(); }}):el('span',{class:'icon-ph'})])); });
        box.append(el('button',{class:'add-row', html:svg('plus')+'<span>Ajouter une voie</span>', onclick:()=>{ d.voies.push({nom:'V'+(d.voies.length+1), type:'principale'}); draw3(); drawRail(); }})); };
      draw3(); return [box, tried && !STEPS[2].ok(d) ? el('p',{class:'err'},'Chaque voie doit avoir un nom.') : null]; },
    // 4 — intervenants
    ()=>{ const blocks=[field('Entreprise', input(d.f,'entreprise',{ph:'EIFFAGE RAIL', on:drawRail}), {req:true, err:err(filled(d.f.entreprise))})];
      ROLES.forEach(([k,lab])=>{ const list=el('div',{class:'people'}); const drawP=()=>{ list.innerHTML='';
          d.people[k].forEach((nm,i)=>list.append(el('div',{class:'person'},[el('span',{},nm), el('button',{class:'icon', 'aria-label':'Retirer '+nm, html:svg('x'), onclick:()=>{ d.people[k].splice(i,1); drawP(); drawRail(); }})])));
          // ajouté à la touche Entrée, au bouton ou en quittant le champ ; « A, B » ajoute deux noms

          inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(true); } }); inp.addEventListener('change',()=>add(false));

        drawP(); blocks.push(field(lab, list, {req:k==='representant', full:true, err:k==='representant'?err(d.people.representant.length>0):null})); });
      return [el('div',{class:'grid'},blocks)]; },
    // 5 — moyens habituels (les effectifs, variables, se saisissent dans chaque compte rendu)

    // 6 — récapitulatif
    ()=>{ const dl=(i,rows)=>el('div',{class:'recap'},[el('div',{class:'recap-h'},[el('strong',{},STEPS[i].t), el('button',{class:'link', onclick:()=>{ step=i; viewWizard.step=i; draw(); }},'Modifier')]),

    const prev=el('button',{class:'btn btn-l', disabled:step===0, onclick:()=>{ commit(); step--; viewWizard.step=step; tried=false; draw(); }},'Précédent');
    const last=step===STEPS.length-1;
    const next=el('button',{class:'btn btn-primary btn-l', onclick:()=>{ commit();
      if(!last){ if(!s.ok(d)){ tried=true; draw(); return; } step++; viewWizard.step=step; tried=false; draw(); window.scrollTo({top:0, behavior:'smooth'}); return; }
      const bad=STEPS.findIndex(x=>!x.ok(d)); if(bad>=0){ step=bad; tried=true; draw(); return; }

      : last ? [['wzend','.wz-foot .btn-primary','Dernière vérification','Relisez le récapitulatif, puis touchez « Créer le projet ».',true]] : [])); };

/* ---------- historique d'un projet ---------- */

/* ---------- compte rendu ---------- */
// observations fictives, en grisé dans les cases vides, pour guider la saisie (jamais imprimées)
const EX = { obsLorry:'Lorry en appui au déchargement', obsTrain:'Deux rotations de ballast', obsPPSPS:'PPSPS vu avec le chef de chantier',
  obsBriefing:'Briefing fait, 14 présents', obsStopGo:'Arrêt 10 min, balisage repris', obsAccident:'Coupure légère, soins sur place',
  obsIntemperie:'Pluie forte en fin de poste', obsAnnules:'Bourrage reporté, engin en panne', obsAleas:'Panne bourreuse, 30 min d’arrêt',
  obsImpact:'Restitution en retard de 15 min', chem:'Cheminement dégagé et balisé', niches:'Niche encombrée au PK 21+040',
  plateforme:'Ballast à reprofiler côté V2', graisseux:'Graisseurs vérifiés, conformes',
  travauxPrevus:'Remplacement de 24 traverses en voie 1', travauxRealises:'24 traverses remplacées, voie rendue à l’heure', commentaires:'Chantier propre, consignes respectées' };
const OUI_NON=[['oui','Oui'],['non','Non']], NON_OUI=[['non','Non'],['oui','Oui']];
// une question Oui | Non, suivie de son observation
function ynRow(cr, label, k, obs, on, o={}){ const y=cr.yn; const i=obs?input(cr.f,obs,{on, memo:true, ph:EX[obs]}):null; const note=o.note?el('span',{class:'renvoi'+(y[k]==='oui'?' on':'')},o.note):null;
  return el('div',{class:'qn', 'data-k':k},[el('div',{class:'q-l'},[el('span',{},label), note]), seg(o.nonFirst?NON_OUI:OUI_NON,()=>y[k]||'',v=>{ y[k]=v; },{on:v=>{ if(note) note.classList.toggle('on',v==='oui'); if(i && v==='oui' && o.focus && !i.value) i.focus(); on(); }}),
    el('div',{class:'q-o'},i?[i]:[])]); }
// raccourci (« Tout conforme »…) : ne remplit que ce qui est vide, et disparaît quand il n'a plus rien à remplir
function quickFill(label, can, fill, after){ const b=el('button',{type:'button', class:'link', onclick:()=>{ fill(); after(); }},label); b.sync=()=>{ b.hidden=!can(); }; b.sync(); return b; }
const emptyOf = (o, vals) => [()=>Object.keys(vals).some(k=>!o[k]), ()=>Object.entries(vals).forEach(([k,v])=>{ if(!o[k]) o[k]=v; })];
// conduit au champ demandé et le signale un instant
function jumpTo(a){ const t=document.querySelector(`#app [data-k="${a}"]`); if(!t) return;
  t.scrollIntoView({behavior:'smooth', block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
  // le clavier ne s'ouvre que si le premier contrôle du champ est une zone de texte (pas pour des cases à cocher)
  const i=t.matches('.fld') && t.querySelector('select,input,textarea,.ck'); if(i && i.matches('input[type=text],textarea') && !i.value) setTimeout(()=>i.focus({preventScroll:true}),450); }
// rubriques pliées ou dépliées, gardées le temps de la session ; au départ, seules les rubriques à compléter sont dépliées
const folds = {};
const foldOf = cr => folds[cr.id] || (folds[cr.id]=Object.fromEntries(tally(cr).secs.map(({s,miss})=>[s.id, miss.length>0])));
function markExported(cr){ cr.exported=Date.now(); save(); if(view==='cr') rerender(); }
const preview = cr => openPreview(cr, ()=>markExported(cr));
// pied d'étape : l'étape d'avant à gauche, la suite à droite
const stepFoot = (prev, next, note) => el('div',{class:'foot'},[
  prev ? el('button',{class:'btn btn-l', html:svg('back')+`<span>${esc(prev[0])}</span>`, onclick:prev[1]}) : null,
  note ? el('p',{class:'foot-n'},note) : el('span',{class:'foot-sp'}),
  next ? el('button',{class:'btn btn-primary btn-l', html:`<span>${esc(next[0])}</span>`+svg('next'), onclick:next[1]}) : null ]);
// les trois étapes, comme les stations d'une ligne
function stepper(cr, goStep){ const btns=[], links=[]; const nav=el('nav',{class:'steps', 'aria-label':'Étapes du compte rendu'});
  STEPS_CR.forEach((t,i)=>{ if(i){ const l=el('span',{class:'stp-l', 'aria-hidden':'true'}); links.push(l); nav.append(l); }
    const n=el('span',{class:'stp-n'}); const b=el('button',{type:'button', class:'stp'+(cr.step===i+1?' on':''), 'aria-current':cr.step===i+1?'step':false, onclick:()=>goStep(i+1)},[n, el('span',{class:'stp-t'},t)]); b.num=n; btns.push(b); nav.append(b); });
  nav.paint=()=>{ const done=[START(cr).every(Boolean), !tally(cr).left, !!cr.exported];
    btns.forEach((b,i)=>{ b.classList.toggle('ok',done[i]); b.num.innerHTML=done[i]&&cr.step!==i+1?svg('check'):String(i+1); }); links.forEach((l,i)=>l.classList.toggle('ok',done[i])); };
  nav.paint(); return nav; }

function viewCR(app){
  const cr=cur(); if(!cr) return go('cra'); const p=projOf(cr);
  if(p && !filled(cr.f.lieu) && filled(p.f.lieu)) cr.f.lieu=p.f.lieu;   // lieu ajouté au projet après coup

    el('div',{class:'head head-cr'},[el('div',{class:'head-t'},[el('h1',{},crDate(cr)), el('p',{},[cr.f.projet, p&&p.f.reseau&&p.f.ligne?LINES_LABEL(p.f.reseau,p.f.ligne):''].filter(Boolean).join(' · '))]),
      el('div',{class:'head-a'},[el('button',{class:'btn', onclick:()=>preview(cr)},'Aperçu')])]), bar);
  [stepStart, stepSheet, stepCheck][cr.step-1](app, cr, p, goStep, bar); }

// 1 — avant le chantier : les quatre questions du démarrage
function stepStart(app, cr, p, goStep, bar){ const f=cr.f, y=cr.yn, marks=[];
  const changed=()=>{ saveSoon(cr); marks.forEach(m=>m()); bar.paint(); };
  const block=(i, title, ok, body, action)=>{ const n=el('span',{class:'st-n'}); marks.push(()=>{ const d=ok(); n.classList.toggle('ok',d); n.innerHTML=d?svg('check'):String(i); });
    return el('section',{class:'st'},[el('div',{class:'st-h'},[n, el('h2',{},title), action||null]), body]); };
  ETAT.forEach(([k])=>{ cr.etat[k]=cr.etat[k]||{}; });
  const conforme=quickFill('Tout conforme',()=>ETAT.some(([k])=>!cr.etat[k].avant),()=>ETAT.forEach(([k])=>{ cr.etat[k].avant=cr.etat[k].avant||'C'; }),()=>{ saveSoon(cr); rerender(); });

  app.append(el('div',{class:'start'},[
      block(1,'Début d’intervention',()=>filled(f.heureDebut), el('div',{class:'st-b'},[time(f,'heureDebut',changed)])),
      block(2,'Plan de prévention / LTV / PPSPS',()=>!!(y.ppsps&&y.ltv), el('div',{class:'st-b qs'},[ynRow(cr,'Plan de prévention / PPSPS','ppsps','obsPPSPS',changed), ynRow(cr,'LTV','ltv',null,changed)])),

        seg(OUI_NON,()=>y.consignation||'',v=>{ y.consignation=v; },{on:()=>{ changed(); rerender(); }}),
        consig?field('Heure de consignation', time(f,'heureConsignation',changed)):null, consig?field('Responsable consignation', combo(f,'respConsignation',{project:p, on:changed})):null])),
      block(4,'État des lieux avant travaux',()=>ETAT.every(([k])=>cr.etat[k].avant), el('div',{class:'st-b etat'}, ETAT.map(([k,lab])=>{ const e=cr.etat[k];
        return el('div',{class:'etat-r one'},[el('span',{class:'etat-l'},lab), seg([['C','C'],['NC','NC']],()=>e.avant||'',v=>{ e.avant=v; },{cls:'cnc', on:changed}), input(e,'obs',{on:changed, ph:EX[k]})]); })), conforme)]),
    stepFoot(null, ['Fin de chantier',()=>goStep(2)], 'Tout est enregistré au fur et à mesure : vous pouvez fermer l’application et revenir en fin de chantier.'));
  marks.forEach(m=>m());
  later(()=>guide([['steps','.steps','Trois étapes','1 au démarrage du chantier, 2 en fin de chantier, 3 pour vérifier et envoyer. Touchez une étape pour y aller.'],
    ['start','.st','Au démarrage','Répondez aux quatre questions : début d’intervention, plan de prévention / LTV / PPSPS, consignation, état des lieux avant travaux.'],
    ['save','.foot .btn-primary','Tout s’enregistre','Vous pouvez fermer l’application pendant le chantier. En fin de chantier, rouvrez-la : ce compte rendu s’ouvrira directement.']])); }

// 2 — fin de chantier : toute la fiche, dans l'ordre du formulaire, en rubriques pliables
function stepSheet(app, cr, p, goStep, bar){ const f=cr.f, y=cr.yn, fl=cr.flag, fold=foldOf(cr), paints=[], quicks=[], setters=[];
  const paint=()=>{ const t=tally(cr); paints.forEach(fn=>fn(t)); quicks.forEach(b=>b.sync()); bar.paint(); }, changed=()=>{ saveSoon(cr); paint(); };
  const all=el('button',{type:'button', class:'link'}); const paintAll=()=>{ all.textContent=MAP.every(s=>fold[s.id])?'Tout plier':'Tout déplier'; };
  all.addEventListener('click',()=>{ const open=!MAP.every(s=>fold[s.id]); setters.forEach(fn=>fn(open)); paintAll(); });
  const sheet=el('div',{class:'sheet'});
  app.append(el('div',{class:'sheet-bar'},[el('p',{},'La fiche complète, dans l’ordre du formulaire. Touchez un titre pour plier ou déplier.'), all]), sheet);
  const section=(id, kids, action)=>{ const m=MAP.find(s=>s.id===id); const badge=el('span',{class:'badge'}), sub=el('span',{class:'sec-sub'});
    const head=el('button',{type:'button', class:'sec-h'},[el('span',{class:'sec-chev', html:svg('chev')}), el('span',{class:'sec-tt'},[el('h2',{},m.t), sub]), badge]);
    const box=el('section',{class:'sec', id:'sec-'+id},[head, el('div',{class:'sec-b'},[action?el('div',{class:'sec-tools'},[action]):null, ...kids.filter(Boolean)])]);
    const paint=t=>{ const n=t.secs.find(x=>x.s.id===id).miss.length; badge.className='badge'+(n?'':' ok'); badge.innerHTML=n?`${n} à saisir`:svg('check')+'<span>Complet</span>'; sub.textContent=fold[id]?'':m.sum(cr); };
    const set=open=>{ fold[id]=open; box.classList.toggle('open',open); head.setAttribute('aria-expanded',String(open)); paint(tally(cr)); };
    head.addEventListener('click',()=>{ set(!fold[id]); paintAll(); });
    paints.push(paint); setters.push(set); sheet.append(box); set(!!fold[id]); };
  const quick=(label, [can, fill])=>{ const b=quickFill(label, can, fill, ()=>{ saveSoon(cr); rerender(); }); quicks.push(b); return b; };
  const grid=kids=>el('div',{class:'grid'},kids.filter(Boolean));
  const cks=list=>el('div',{class:'cks'},list);
  const c=(key,o={})=>combo(f,key,{project:p, on:changed, ...o});
  const q=(label, k, obs, o)=>ynRow(cr, label, k, obs, changed, o);
  const flagBox=(k,l)=>check(l,()=>fl[k],v=>{ fl[k]=v; },changed);
  // Identification — voie principale / secondaire suivent le type des voies cochées
  const voieFlags=[flagBox('voiePrincipale','Voie principale'), flagBox('voieSecondaire','Voie secondaire')];
  const voies=multiPick(p?p.voies.map(v=>v.nom):[], ()=>splitList(f.voie), v=>{ f.voie=v.join(', '); const vs=p?p.voies.filter(x=>v.includes(x.nom)):[];
      if(vs.length || !v.length){ fl.voiePrincipale=vs.some(x=>x.type==='principale'); fl.voieSecondaire=vs.some(x=>x.type==='secondaire'); } voieFlags.forEach(b=>b.paint()); }, changed, 'Autre voie');

  section('horaires',[grid([field('Début d’intervention', time(f,'heureDebut',changed), {req:true, k:'heureDebut'}), field('Fin d’intervention', time(f,'heureFin',changed), {req:true, k:'heureFin'})]),
